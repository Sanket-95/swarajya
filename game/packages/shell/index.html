<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swarajya</title>
    <!--
      Session 7 adds an import map here so separately built missions share the Shell's
      single copy of `three` and `@swarajya/sdk` in production.
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #9cc7e6;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #hint {
        position: fixed;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        padding: 4px 10px;
        font:
          13px/1.4 system-ui,
          sans-serif;
        color: #fff;
        background: rgba(0, 0, 0, 0.45);
        border-radius: 4px;
        pointer-events: none;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hint">
      Click to control · W A S D move · Shift run · Mouse look · Wheel zoom · Esc release · F3 stats
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
